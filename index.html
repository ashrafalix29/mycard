    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #060a14;
            --navy-800: #0b1120;
            --navy-700: #131c30;
            --navy-600: #1c2942;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --text-primary: #eef2f8;
            --text-muted: #8494ad;
            --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        body {
            background:
                radial-gradient(circle at 20% 0%, rgba(34,211,238,0.10), transparent 45%),
                radial-gradient(circle at 85% 100%, rgba(59,130,246,0.12), transparent 50%),
                var(--bg-deep);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 14px;
        }

        /* Rotating glow frame around the whole card */
        .glow-frame {
            position: relative;
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 3px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.55);
        }

        .glow-spin {
            position: absolute;
            inset: -60%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--cyan) 60deg,
                var(--blue) 140deg,
                transparent 220deg,
                transparent 300deg,
                var(--cyan) 360deg
            );
            animation: spin 5s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Main Card Container */
        .card {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, var(--navy-700) 0%, var(--navy-800) 100%);
            width: 100%;
            border-radius: 21px;
            overflow: hidden;
        }

        /* Header Banner */
        .cover-bg {
            height: 140px;
            background:
                linear-gradient(180deg, rgba(6,10,20,0.35) 0%, rgba(6,10,20,0.75) 100%),
                linear-gradient(135deg, rgba(34,211,238,0.16) 0%, rgba(59,130,246,0.08) 55%, transparent 100%),
                url('https://raw.githubusercontent.com/ashrafalix29/mycard/main/9a966341-ec91-4452-ab12-a78134fc2322.jpg_202609081809.jpeg') center 25% / cover no-repeat,
                var(--navy-700);
            position: relative;
            overflow: hidden;
        }

        .cover-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent);
        }

        .cover-tag {
            position: absolute;
            top: 14px;
            right: 16px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.02em;
            color: var(--cyan);
            background: rgba(6,10,20,0.55);
            border: 1px solid rgba(34,211,238,0.35);
            padding: 4px 9px;
            border-radius: 7px;
        }

        /* gemini code  */

/* ১. ব্লিংকিং অ্যানিমেশন তৈরি */
@keyframes blink {
  0% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}

/* ২. আপনার মূল .cover-tag কোড */
.cover-tag {
  position: absolute;
  top: 1rem;
  right: 1rem;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--cyan);
  background: rgba(6,10,20,0.55);
  border: 1px solid rgba(34,211,238,0.35);
  padding: .2rem .5rem;
  border-radius: 7px;
  
  /* টেক্সট ও ডট এক লাইনে সেন্টার রাখার জন্য */
  display: inline-flex;
  align-items: center;
  vertical-align: center;
  gap: 3px;
}

/* ৩. বাম পাশের গ্রিন ডট */
.cover-tag::before {
  content: "";
  width: 7px;
  height: 7px;
  background-color: #22c55e; /* সবুজ রঙ */
  border-radius: 50%;
  box-shadow: 0 0 6px #22c55e; /* গ্লো (Glow) ইফেক্ট */
  animation: blink 1.5s infinite ease-in-out; /* অনবরত ব্লিংক করবে */
}



        /* Avatar */
        .avatar-container {
            position: absolute;
            top: 88px;
            left: 20px;
        }

        .avatar-ring {
            width: 98px;
            height: 98px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 200deg, var(--cyan), var(--blue), var(--cyan));
            box-shadow: 0 0 22px rgba(34,211,238,0.35);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--navy-800);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 3px solid var(--navy-700);
        }

        .avatar-placeholder {
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            line-height: 1.25;
         
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            scale: 1.35;
            object-position: -.1rem 0.3rem;
        }

        /* Profile Info */
        .profile-info {
            padding: 46px 20px 6px 20px;
        }

        .profile-info h2 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .rainbow-name {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 3s linear infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        .profile-info .role-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 0px;
        }

        .role-row hr {
            width: 1px;
            height: 14px;
            border: none;
            background: rgba(255,255,255,0.14);
            margin: 0;
        }

        .role-row p.code-chip {
            font-family: var(--mono);
            font-size: 11px;
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.25);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .role-row p.code-chip span {
            background: linear-gradient(270deg, #0062ff, #ffffff, #0062ff, #fef3c7, #0062ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            animation: chipShift 15s ease-in-out infinite;
        }

        @keyframes chipShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Grid Icons Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 12px;
            padding: 18px 20px 26px 20px;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            outline: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .icon-box {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            background: var(--navy-600);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .icon-box svg.brand-icon {
            width: 26px;
            height: 26px;
        }

        .corner-arrow {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 12px;
            height: 12px;
            color: var(--text-primary);
            opacity: 0;
            transform: translate(-3px, 3px);
            transition: all 0.25s ease;
        }

        .grid-item:hover .icon-box,
        .grid-item:focus .icon-box,
        .grid-item:active .icon-box {
            transform: translateY(-4px);
            border-color: var(--brand, var(--cyan));
            box-shadow: 0 0 0 1px var(--brand, var(--cyan)), 0 10px 24px rgba(0,0,0,0.4), 0 0 18px color-mix(in srgb, var(--brand, var(--cyan)) 45%, transparent);
        }

        .grid-item:hover .corner-arrow {
            opacity: 1;
            transform: translate(0, 0);
        }

        .grid-item span {
            margin-top: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        /* Footer */

            text-align: center;
